name: Sync to Gitee

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Push main and tags to Gitee
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          GITEE_USERNAME="${GITEE_USERNAME:-nagoyaaaaa}"
          if [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_TOKEN is not configured."
            exit 1
          fi
          git remote add gitee "https://${GITEE_USERNAME}:${GITEE_TOKEN}@gitee.com/nagoyaaaaa/checkmiss.git"
          git push gitee HEAD:main
          git push gitee --tags
