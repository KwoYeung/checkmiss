name: Sync Release to Gitee

on:
  release:
    types:
      - published
      - edited
  workflow_dispatch:
    inputs:
      tag:
        description: "GitHub release tag to sync, for example v10.1.6"
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi

          if [ -z "$TAG" ]; then
            echo "Release tag is empty."
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Sync GitHub release to Gitee release
        env:
          GH_TOKEN: ${{ github.token }}
          GITEE_OWNER: ${{ vars.GITEE_OWNER }}
          GITEE_REPO: ${{ vars.GITEE_REPO }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail

          if [ -z "$GITEE_OWNER" ] || [ -z "$GITEE_REPO" ] || [ -z "$GITEE_TOKEN" ]; then
            echo "GITEE_OWNER, GITEE_REPO or GITEE_TOKEN is not configured."
            echo "Set repository variables GITEE_OWNER/GITEE_REPO and repository secret GITEE_TOKEN."
            exit 1
          fi

          GITEE_API="https://gitee.com/api/v5/repos/${GITEE_OWNER}/${GITEE_REPO}"
          GITEE_GIT_URL="https://${GITEE_OWNER}:${GITEE_TOKEN}@gitee.com/${GITEE_OWNER}/${GITEE_REPO}.git"

          gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json name,body,assets \
            > github-release.json

          RELEASE_NAME="$(jq -r '.name // ""' github-release.json)"
          RELEASE_BODY="$(jq -r '.body // ""' github-release.json)"
          if [ -z "$RELEASE_NAME" ] || [ "$RELEASE_NAME" = "null" ]; then
            RELEASE_NAME="$TAG"
          fi

          git remote add gitee "$GITEE_GIT_URL"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            git push gitee "refs/tags/${TAG}:refs/tags/${TAG}" \
              || echo "Tag ${TAG} may already exist on Gitee; continue syncing release."
          else
            echo "Local tag ${TAG} was not found; skip tag push and try to create release only."
          fi

          HTTP_CODE="$(
            curl -sS \
              -o gitee-release.json \
              -w "%{http_code}" \
              "${GITEE_API}/releases/tags/${TAG}?access_token=${GITEE_TOKEN}"
          )"

          if [ "$HTTP_CODE" = "200" ]; then
            GITEE_RELEASE_ID="$(jq -r '.id' gitee-release.json)"
            echo "Gitee release already exists: ${GITEE_RELEASE_ID}"
          else
            HTTP_CODE="$(
              curl -sS \
                -X POST \
                -o gitee-release.json \
                -w "%{http_code}" \
                --form-string "access_token=${GITEE_TOKEN}" \
                --form-string "tag_name=${TAG}" \
                --form-string "name=${RELEASE_NAME}" \
                --form-string "body=${RELEASE_BODY}" \
                "${GITEE_API}/releases"
            )"

            if [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "200" ]; then
              echo "Failed to create Gitee release. HTTP ${HTTP_CODE}"
              cat gitee-release.json
              exit 1
            fi

            GITEE_RELEASE_ID="$(jq -r '.id' gitee-release.json)"
            echo "Created Gitee release: ${GITEE_RELEASE_ID}"
          fi

          mkdir -p release-assets
          gh release download "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --clobber

          shopt -s nullglob
          for file in release-assets/*; do
            echo "Uploading asset: $(basename "$file")"
            HTTP_CODE="$(
              curl -sS \
                -X POST \
                -o upload-response.json \
                -w "%{http_code}" \
                -F "access_token=${GITEE_TOKEN}" \
                -F "file=@${file}" \
                "${GITEE_API}/releases/${GITEE_RELEASE_ID}/attach_files"
            )"

            if [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "200" ]; then
              echo "Failed to upload asset $(basename "$file"). HTTP ${HTTP_CODE}"
              cat upload-response.json
              exit 1
            fi
          done

          echo "Release ${TAG} synced to Gitee."
